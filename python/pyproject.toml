[project]
name = "eduagent-harness"
version = "0.2.0"
description = "Reliable execution harness and evaluation tools for the EduAgent tutor"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.104.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "openai>=2.38.0",
    "opentelemetry-api>=1.38.0",
    "opentelemetry-exporter-otlp-proto-http>=1.38.0",
    "opentelemetry-sdk>=1.38.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "prometheus-client>=0.23.1",
    "redis>=7.4.0",
    "sqlalchemy[asyncio]>=2.0.50",
    "uvicorn>=0.48.0",
    "websockets>=16.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.3.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[project.scripts]
eduagent-eval = "evals.cli:main"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "agents*",
    "api*",
    "config*",
    "core*",
    "evals*",
    "interaction*",
    "llm*",
    "models*",
    "repositories*",
    "schemas*",
    "services*",
]
exclude = ["tests*"]

[tool.setuptools.package-data]
"evals.datasets" = ["*.jsonl", "README.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "distributed_integration: requires a PostgreSQL integration database",
]
