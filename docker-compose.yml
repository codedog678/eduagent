version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: edu_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Python API 后端
  python-api:
    build:
      context: ./python
      dockerfile: Dockerfile
    ports:
      - "8888:8888"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/edu_agent
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      - MODEL_ID=${MODEL_ID:-claude-3-sonnet-20240229}
      - ENABLE_DB_LOGGING=true
      - HARNESS_STORE_PATH=/app/data/harness.sqlite3
    volumes:
      - harnessdata:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  # React 前端
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - python-api

volumes:
  pgdata:
  harnessdata:
