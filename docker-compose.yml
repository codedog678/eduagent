services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: edu_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    profiles: ["distributed"]
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

  # Python API 后端
  python-api:
    build:
      context: ./python
      dockerfile: Dockerfile
    ports:
      - "8888:8888"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/edu_agent
      - LLM_PROVIDER=${LLM_PROVIDER:-auto}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      - MODEL_ID=${MODEL_ID:-claude-3-sonnet-20240229}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-flash}
      - DEEPSEEK_THINKING=${DEEPSEEK_THINKING:-disabled}
      - DEEPSEEK_REASONING_EFFORT=${DEEPSEEK_REASONING_EFFORT:-high}
      - ENABLE_DB_LOGGING=true
      - HARNESS_STORE_PATH=/app/data/harness.sqlite3
      - HARNESS_QUEUE_TIMEOUT_SECONDS=${HARNESS_QUEUE_TIMEOUT_SECONDS:-10}
      - LLM_MAX_CONCURRENCY=${LLM_MAX_CONCURRENCY:-4}
      - LLM_QUEUE_TIMEOUT_SECONDS=${LLM_QUEUE_TIMEOUT_SECONDS:-10}
    volumes:
      - harnessdata:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  # React 前端
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - python-api

  distributed-api:
    profiles: ["distributed"]
    build:
      context: ./python
      dockerfile: Dockerfile
    command:
      - uvicorn
      - api.distributed_main:app
      - --host
      - 0.0.0.0
      - --port
      - "8890"
    ports:
      - "127.0.0.1:8890:8890"
    environment:
      <<: &distributed-env
        DISTRIBUTED_ENABLED: "true"
        DISTRIBUTED_EXPERTS_ENABLED: "true"
        DISTRIBUTED_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/edu_agent
        DISTRIBUTED_REDIS_URL: redis://redis:6379/1
        EXPERT_STREAM: ${EXPERT_STREAM:-eduagent:experts}
        EXPERT_CONSUMER_GROUP: ${EXPERT_CONSUMER_GROUP:-eduagent-expert-workers}
        EXPERT_LEASE_SECONDS: ${EXPERT_LEASE_SECONDS:-15}
        EXPERT_HEARTBEAT_SECONDS: ${EXPERT_HEARTBEAT_SECONDS:-3}
        LLM_PROVIDER: template
        MEMORY_RETRIEVAL_MODE: lexical
        MEMORY_WORKER_ENABLED: "false"
      OPS_API_TOKEN: ${OPS_API_TOKEN:-local-ops-console}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8890/api/health', timeout=2)
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  run-dispatcher:
    profiles: ["distributed"]
    build:
      context: ./python
      dockerfile: Dockerfile
    command: ["python", "-m", "core.distributed.cli", "dispatcher"]
    environment: *distributed-env
    depends_on:
      distributed-api:
        condition: service_healthy

  run-reaper:
    profiles: ["distributed"]
    build:
      context: ./python
      dockerfile: Dockerfile
    command: ["python", "-m", "core.distributed.cli", "reaper"]
    environment: *distributed-env
    depends_on:
      distributed-api:
        condition: service_healthy

  run-worker-a:
    profiles: ["distributed"]
    build:
      context: ./python
      dockerfile: Dockerfile
    command: ["python", "-m", "core.distributed.cli", "worker"]
    environment:
      <<: *distributed-env
      DISTRIBUTED_WORKER_ID: worker-a
      DISTRIBUTED_DEMO_PAUSE_BEFORE_COMMIT_SECONDS: ${DISTRIBUTED_DEMO_PAUSE_BEFORE_COMMIT_SECONDS:-0}
      HARNESS_STORE_PATH: /app/data/distributed-harness.sqlite3
    volumes:
      - distributed_harnessdata:/app/data
    depends_on:
      distributed-api:
        condition: service_healthy

  run-worker-b:
    profiles: ["distributed"]
    build:
      context: ./python
      dockerfile: Dockerfile
    command: ["python", "-m", "core.distributed.cli", "worker"]
    environment:
      <<: *distributed-env
      DISTRIBUTED_WORKER_ID: worker-b
      HARNESS_STORE_PATH: /app/data/distributed-harness.sqlite3
    volumes:
      - distributed_harnessdata:/app/data
    depends_on:
      distributed-api:
        condition: service_healthy

  expert-dispatcher:
    profiles: ["distributed"]
    build:
      context: ./python
      dockerfile: Dockerfile
    command: ["python", "-m", "core.distributed.cli", "expert-dispatcher"]
    environment: *distributed-env
    depends_on:
      distributed-api:
        condition: service_healthy

  expert-reaper:
    profiles: ["distributed"]
    build:
      context: ./python
      dockerfile: Dockerfile
    command: ["python", "-m", "core.distributed.cli", "expert-reaper"]
    environment: *distributed-env
    depends_on:
      distributed-api:
        condition: service_healthy

  expert-worker-a:
    profiles: ["distributed"]
    build:
      context: ./python
      dockerfile: Dockerfile
    command: ["python", "-m", "core.distributed.cli", "expert-worker"]
    environment:
      <<: *distributed-env
      EXPERT_WORKER_ID: expert-a
      EXPERT_WORKER_ROLES: Assessment,Curriculum,Tutor
      EXPERT_DEMO_PAUSE_BEFORE_RESULT_SECONDS: ${EXPERT_DEMO_PAUSE_BEFORE_RESULT_SECONDS:-0}
    depends_on:
      distributed-api:
        condition: service_healthy

  expert-worker-b:
    profiles: ["distributed"]
    build:
      context: ./python
      dockerfile: Dockerfile
    command: ["python", "-m", "core.distributed.cli", "expert-worker"]
    environment:
      <<: *distributed-env
      EXPERT_WORKER_ID: expert-b
      EXPERT_WORKER_ROLES: Assessment,Curriculum,Tutor
    depends_on:
      distributed-api:
        condition: service_healthy

volumes:
  pgdata:
  harnessdata:
  redisdata:
  distributed_harnessdata:
